name: zh-TW payload audit

on:
  push:
    branches: [zh-tw]
    paths:
      - "tools/zh_tw_payload_tool.py"
      - "tools/zh_tw_glossary.json"
      - "tests/test_zh_tw_payload_tool.py"
      - "patches/zone/chinese/**"
      - "locales/zh-TW/**"
      - "requirements-zh-tw.txt"
      - ".github/workflows/zh-tw-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zh-TW conversion dependency
        run: python -m pip install -r requirements-zh-tw.txt

      - name: Run unit tests
        run: python -m unittest tests/test_zh_tw_payload_tool.py -v

      - name: Run Steam startup repair tests
        run: python -m unittest tests/test_steam_startup_repair.py -v

      - name: Scan all legacy payloads
        run: |
          mkdir -p work
          python tools/zh_tw_payload_tool.py scan patches/zone/chinese \
            --out work/zh_tw_manifest.json \
            --glossary tools/zh_tw_glossary.json \
            --opencc-config s2tw \
            --auto | tee work/scan.txt

      - name: Reject known semantic conversion hazards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("work/zh_tw_manifest.json").read_text(encoding="utf-8"))
          forbidden = ("計程車兵", "最最佳化", "重重新整理")
          bad = []
          for entry in manifest["entries"]:
              text = entry.get("zh_tw") or ""
              for needle in forbidden:
                  if needle in text:
                      bad.append((entry["id"], needle, text))
          if bad:
              for item in bad:
                  print("semantic hazard:", item)
              raise SystemExit(1)
          print("semantic hazard check: clean")
          PY

      - name: Generate glyph inventory
        run: |
          python tools/zh_tw_payload_tool.py glyphs work/zh_tw_manifest.json \
            --localization locales/zh-TW/localization.tw \
            --out work/required_zh_tw_glyphs.txt



      - name: Download pinned OpenAssetTools
        run: |
          curl -L --fail --retry 3 \
            -o work/oat-linux.tar.gz \
            https://github.com/Laupetin/OpenAssetTools/releases/download/v0.33.0/oat-linux.tar.gz
          echo "aa0b80f633c50d656b26d28b4899fd76bd994024ff0c669303ed5db52cc9e864  work/oat-linux.tar.gz" | sha256sum -c -
          mkdir -p work/oat
          tar -xzf work/oat-linux.tar.gz -C work/oat
          find work/oat -maxdepth 3 -type f -iname 'Unlinker*' -print

      - name: Dump COD4 font assets from patched code_post_gfx
        run: |
          mkdir -p work/font-dump
          UNLINKER="$(find "$GITHUB_WORKSPACE/work/oat" -type f -name 'Unlinker' -o -name 'Unlinker.exe' | head -n 1)"
          if [ -z "$UNLINKER" ]; then
            echo "Unlinker binary not found"
            exit 1
          fi
          chmod +x "$UNLINKER"
          cd work/font-dump
          "$UNLINKER" --verbose \
            --search-path "$GITHUB_WORKSPACE/patches/main" \
            "$GITHUB_WORKSPACE/patches/zone/code_post_gfx.ff" \
            | tee "$GITHUB_WORKSPACE/work/font-unlinker.log"
          find . -type f | sort > "$GITHUB_WORKSPACE/work/font-dump-files.txt"

      - name: Audit Traditional Chinese glyph coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required_text = Path("work/required_zh_tw_glyphs.txt").read_text(encoding="utf-8").strip()
          required = {}
          for ch in required_text:
              raw = ch.encode("gbk")
              if len(raw) == 1:
                  code = raw[0]
              elif len(raw) == 2:
                  code = (raw[0] << 8) | raw[1]
              else:
                  raise SystemExit(f"unexpected GBK width for {ch!r}: {raw.hex()}")
              required[code] = ch

          font_files = []
          for path in Path("work/font-dump").rglob("*.json"):
              try:
                  obj = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if obj.get("_type") != "font":
                  continue

              font = obj.get("font")
              if not isinstance(font, dict):
                  continue
              glyphs = font.get("glyphs")
              if not isinstance(glyphs, list):
                  continue

              letters = {
                  int(g["letter"])
                  for g in glyphs
                  if isinstance(g, dict) and "letter" in g
              }
              covered = set(required).intersection(letters)
              missing = set(required).difference(letters)
              chinese_like = sum(1 for x in letters if x > 0xFF)
              font_files.append({
                  "path": path.as_posix(),
                  "glyph_count": len(letters),
                  "double_byte_glyphs": chinese_like,
                  "covered": len(covered),
                  "missing": len(missing),
                  "missing_chars": "".join(required[x] for x in sorted(missing)),
              })

          if not font_files:
              print("No font JSON assets were dumped.")
              print(Path("work/font-dump-files.txt").read_text(encoding="utf-8", errors="replace"))
              raise SystemExit(1)

          font_files.sort(key=lambda x: (-x["covered"], x["missing"], x["path"]))
          best = font_files[0]
          Path("work/font-coverage.json").write_text(
              json.dumps(font_files, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# COD4 zh-TW font coverage audit",
              "",
              f"- required zh-TW glyphs: {len(required)}",
              f"- dumped font assets: {len(font_files)}",
              f"- best font: \`{best['path']}\`",
              f"- best font glyph count: {best['glyph_count']}",
              f"- best font double-byte glyphs: {best['double_byte_glyphs']}",
              f"- covered required glyphs: {best['covered']}",
              f"- missing required glyphs: {best['missing']}",
              "",
              "## Fonts",
          ]
          for f in font_files:
              lines.append(
                  f"- \`{f['path']}\`: glyphs={f['glyph_count']}, "
                  f"double-byte={f['double_byte_glyphs']}, "
                  f"covered={f['covered']}, missing={f['missing']}"
              )
          lines += ["", "## Missing glyphs in best font", "", best["missing_chars"] or "(none)"]
          Path("work/font-coverage.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines[:12]))
          PY

      - name: Generate audit summary
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          m = json.loads(Path("work/zh_tw_manifest.json").read_text(encoding="utf-8"))
          entries = m["entries"]
          c = Counter(e["status"] for e in entries)
          files = sorted({e["file"] for e in entries})
          glyphs = Path("work/required_zh_tw_glyphs.txt").read_text(encoding="utf-8").strip()

          mismatch = [e for e in entries if e["status"] == "length_mismatch"]
          unenc = [e for e in entries if e["status"] == "unencodable_gbk"]

          lines = [
              "# COD4 zh-TW payload audit",
              "",
              f"- scanned text entries: {len(entries)}",
              f"- files containing detected CJK text: {len(files)}",
              f"- candidate_safe: {c.get('candidate_safe', 0)}",
              f"- length_mismatch: {c.get('length_mismatch', 0)}",
              f"- unencodable_gbk: {c.get('unencodable_gbk', 0)}",
              f"- required CJK glyphs: {len(glyphs)}",
              "",
              "## Length mismatches",
          ]
          for e in mismatch[:100]:
              lines.append(
                  f"- `{e['file']}` [{e['start']}:{e['end']}]: "
                  f"`{e['original']}` → `{e['zh_tw']}` "
                  f"({e['original_len']} → {e['candidate_len']} bytes)"
              )
          if len(mismatch) > 100:
              lines.append(f"- ... and {len(mismatch)-100} more")

          lines += ["", "## GBK-unencodable candidates"]
          for e in unenc[:100]:
              lines.append(
                  f"- `{e['file']}` [{e['start']}:{e['end']}]: "
                  f"`{e['original']}` → `{e['zh_tw']}`"
              )
          if len(unenc) > 100:
              lines.append(f"- ... and {len(unenc)-100} more")

          Path("work/audit-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines[:12]))
          PY

      - name: Probe Chinese font resources
        run: |
          python tools/font_mapping_probe.py \
            --iwd patches/main/localized_chinese_iw15.iwd \
            --ff patches/zone/code_post_gfx.ff \
            --out work/font-probe.json

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: zh-tw-payload-audit
          path: |
            work/zh_tw_manifest.json
            work/required_zh_tw_glyphs.txt
            work/audit-summary.md
            work/scan.txt
            work/font-probe.json
            work/font-coverage.json
            work/font-coverage.md
            work/font-unlinker.log
            work/font-dump-files.txt
          if-no-files-found: error
